{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}교육 소개{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/landing.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{% url 'course-list' %}">교육 소개</a>
    <nav class="header-links" aria-label="사이트">
      {% block header_links %}{% endblock %}
      <a class="header-link" href="{% url 'admin:index' %}">관리자</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>교육 내용을 확인한 뒤 신청할 수 있습니다.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
